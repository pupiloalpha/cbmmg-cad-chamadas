    <script>
      // Vite HMR is disabled in cloud iFrame environment (DISABLE_HMR=true).
      // Shim HMR WebSocket so client does not attempt failing connections.
      (function() {
        const _OrigWS = window.WebSocket;
        if (_OrigWS) {
          function ViteHmrShim(url, protocols) {
            const isHmr = (typeof protocols === 'string' && protocols.includes('vite-hmr')) ||
                          (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                          (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')));
            if (isHmr) {
              const target = new EventTarget();
              target.url = url;
              target.readyState = 1; // WebSocket.OPEN
              target.OPEN = 1;
              target.CLOSED = 3;
              target.CONNECTING = 0;
              target.CLOSING = 2;
              target.send = function() {};
              target.close = function() {};
              setTimeout(() => {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            return new _OrigWS(url, protocols);
          }
          ViteHmrShim.prototype = _OrigWS.prototype;
          ViteHmrShim.CONNECTING = 0;
          ViteHmrShim.OPEN = 1;
          ViteHmrShim.CLOSING = 2;
          ViteHmrShim.CLOSED = 3;
          window.WebSocket = ViteHmrShim;
        }

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event && event.reason;
          if (reason) {
            const msg = reason.message || String(reason);
            if (msg.includes('WebSocket') || msg.includes('closed without opened')) {
              event.preventDefault();
            }
          }
        });

        const _origConsoleError = console.error;
        console.error = function(...args) {
          if (args.length > 0) {
            const str = String(args[0]);
            if (str.includes('WebSocket') || str.includes('closed without opened') || str.includes('[vite] failed to connect')) {
              return;
            }
          }
          _origConsoleError.apply(console, args);
        };
      })();
    </script>
