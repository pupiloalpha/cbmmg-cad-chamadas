<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo do Ícone (Tático Profundo) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Gradiente Vermelho Institucional CBMMG -->
    <linearGradient id="cbmRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Gradiente Dourado Nobre CBMMG -->
    <linearGradient id="cbmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Gradiente das Barras Estatísticas -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Gradiente da Chama do Bombeiro -->
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Glow / Filtro de Sombra -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. BASE DO ÍCONE (Squircle com Safe Zone PWA) -->
  <!-- ========================================== -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Moldura Chanfrada Externa (Vermelho CBMMG) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#cbmRed)" stroke-width="8"/>

  <!-- Filete Dourado Interno de Precisão -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="url(#cbmGold)" stroke-width="2" stroke-opacity="0.75"/>

  <!-- Grade de Fundo Analítica Sutil (Malha de Dados CAD) -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4,4">
    <line x1="80" y1="180" x2="432" y2="180"/>
    <line x1="80" y1="240" x2="432" y2="240"/>
    <line x1="80" y1="300" x2="432" y2="300"/>
    <line x1="80" y1="360" x2="432" y2="360"/>
    <line x1="160" y1="120" x2="160" y2="400"/>
    <line x1="256" y1="120" x2="256" y2="400"/>
    <line x1="352" y1="120" x2="352" y2="400"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. ONDAS DE TRANSMISSÃO E CHAMADAS (193 / CAD) -->
  <!-- ========================================== -->
  <!-- Arcos Concéntricos de Despacho Operacional -->
  <g fill="none" stroke-linecap="round" opacity="0.85">
    <!-- Onda Externa -->
    <path d="M 160 134 A 120 120 0 0 1 352 134" stroke="url(#cbmRed)" stroke-width="4.5" opacity="0.4"/>
    <!-- Onda Média -->
    <path d="M 188 152 A 86 86 0 0 1 324 152" stroke="url(#cbmGold)" stroke-width="4" opacity="0.7"/>
    <!-- Onda Interna -->
    <path d="M 216 170 A 52 52 0 0 1 296 170" stroke="#fef08a" stroke-width="3.5" opacity="0.9"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. MACHADOS CRUZADOS (Tradição e Força CBMMG) -->
  <!-- ========================================== -->
  <g opacity="0.32" stroke="url(#cbmGold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cabo 1 -->
    <line x1="124" y1="376" x2="388" y2="148" stroke-width="7"/>
    <!-- Cabo 2 -->
    <line x1="388" y1="376" x2="124" y2="148" stroke-width="7"/>
    <!-- Lâmina Machado Esquerda -->
    <path d="M 124 148 C 114 136, 126 118, 142 120 L 154 132 L 138 156 Z" fill="url(#cbmGold)" stroke-width="2"/>
    <!-- Lâmina Machado Direita -->
    <path d="M 388 148 C 398 136, 386 118, 370 120 L 358 132 L 374 156 Z" fill="url(#cbmGold)" stroke-width="2"/>
  </g>

  <!-- ========================================== -->
  <!-- 4. COLUNAS E HISTOGRAMA DE ESTATÍSTICA E DADOS -->
  <!-- ========================================== -->
  <!-- Sombra das Barras -->
  <g fill="#000000" opacity="0.45">
    <rect x="136" y="278" width="36" height="106" rx="8"/>
    <rect x="188" y="238" width="36" height="146" rx="8"/>
    <rect x="238" y="196" width="36" height="188" rx="8"/>
    <rect x="288" y="222" width="36" height="162" rx="8"/>
    <rect x="340" y="258" width="36" height="126" rx="8"/>
  </g>

  <!-- Barras Estatísticas Principais (Gradientes CBMMG) -->
  <!-- Coluna 1 (Prevenção / Ocorrências Menores) -->
  <rect x="132" y="272" width="36" height="106" rx="8" fill="url(#barGrad1)"/>
  <rect x="135" y="274" width="30" height="4" rx="2" fill="#fecaca" opacity="0.8"/>

  <!-- Coluna 2 (Salvamento / APH) -->
  <rect x="184" y="232" width="36" height="146" rx="8" fill="url(#barGrad2)"/>
  <rect x="187" y="234" width="30" height="4" rx="2" fill="#fef08a" opacity="0.8"/>

  <!-- Coluna 3 - Pico Central de Dados (Incêndio / Grandes Emergências) -->
  <rect x="238" y="190" width="36" height="188" rx="8" fill="url(#barGrad3)"/>
  <rect x="241" y="192" width="30" height="4" rx="2" fill="#ffffff" opacity="0.9"/>

  <!-- Coluna 4 (Viaturas Despachadas / Recursos) -->
  <rect x="292" y="216" width="36" height="162" rx="8" fill="url(#barGrad1)"/>
  <rect x="295" y="218" width="30" height="4" rx="2" fill="#fecaca" opacity="0.8"/>

  <!-- Coluna 5 (Tempo de Resposta / Finalizadas) -->
  <rect x="344" y="252" width="36" height="126" rx="8" fill="url(#barGrad4)"/>
  <rect x="347" y="254" width="30" height="4" rx="2" fill="#bae6fd" opacity="0.8"/>

  <!-- Linha de Base do Gráfico -->
  <line x1="112" y1="380" x2="400" y2="380" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- ========================================== -->
  <!-- 5. LINHA DE TENDÊNCIA E PULSO ANALÍTICO (ANALYTICS) -->
  <!-- ========================================== -->
  <!-- Sombra da Linha de Tendência -->
  <path d="M 112 334 L 150 310 L 202 266 L 256 218 L 310 248 L 362 284 L 400 246"
        fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Linha de Tendência Brilhante (Glow Amarelo/Dourado) -->
  <path d="M 112 334 L 150 310 L 202 266 L 256 218 L 310 248 L 362 284 L 400 246"
        fill="none" stroke="url(#cbmGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Linha Central Nítida Branca -->
  <path d="M 112 334 L 150 310 L 202 266 L 256 218 L 310 248 L 362 284 L 400 246"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pontos de Dados / Nós Estatísticos (Data Points) -->
  <circle cx="150" cy="310" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <circle cx="202" cy="266" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="256" cy="218" r="6.5" fill="#facc15" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="310" cy="248" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <circle cx="362" cy="284" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

  <!-- ========================================== -->
  <!-- 6. CHAMA OPERACIONAL CENTRAL (HERO FLAME) -->
  <!-- ========================================== -->
  <g transform="translate(256, 154) scale(0.9)" filter="url(#glow)">
    <!-- Chama Externa Vermelho-Fogo -->
    <path d="M 0 -64 C 28 -28, 48 -4, 34 30 C 22 52, -22 52, -34 30 C -48 -4, -28 -28, 0 -64 Z"
          fill="url(#flameOuter)"/>
    <!-- Chama Interna Dourada -->
    <path d="M 0 -38 C 16 -12, 28 8, 18 26 C 10 38, -10 38, -18 26 C -28 8, -16 -12, 0 -38 Z"
          fill="url(#flameInner)"/>
    <!-- Núcleo Incandescente Branco -->
    <circle cx="0" cy="20" r="7" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- ========================================== -->
  <!-- 7. TAGS INSTITUCIONAIS (193 & CAD CBMMG) -->
  <!-- ========================================== -->
  <!-- Badge Superior: 193 EMERGÊNCIA -->
  <g transform="translate(256, 78)">
    <rect x="-82" y="-18" width="164" height="36" rx="18" fill="#1e293b" stroke="url(#cbmGold)" stroke-width="2.5" filter="url(#dropShadow)"/>
    <!-- Ponto Vermelho de Alerta -->
    <circle cx="-56" cy="0" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Texto 193 CAD -->
    <text x="6" y="5.5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#fef08a" text-anchor="middle" letter-spacing="2">193 • CAD</text>
  </g>

  <!-- Badge Inferior: DADOS & ESTATÍSTICA CBMMG -->
  <g transform="translate(256, 432)">
    <rect x="-144" y="-20" width="288" height="40" rx="12" fill="#0f172a" stroke="url(#cbmRed)" stroke-width="2.5" filter="url(#dropShadow)"/>
    <rect x="-140" y="-16" width="280" height="32" rx="9" fill="none" stroke="url(#cbmGold)" stroke-width="1" stroke-opacity="0.6"/>
    <text x="0" y="5.5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">
      <tspan fill="#ef4444">CBMMG</tspan> • <tspan fill="#facc15">ESTATÍSTICA</tspan>
    </text>
  </g>
</svg>
