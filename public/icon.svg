<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M 256 32 C 340 32, 432 56, 448 96 C 448 240, 390 380, 256 480 C 122 380, 64 240, 64 96 C 80 56, 172 32, 256 32 Z" 
        fill="url(#shieldGrad)" stroke="#facc15" stroke-width="8" filter="url(#shadow)"/>

  <!-- Inner Border Line -->
  <path d="M 256 52 C 328 52, 412 74, 426 108 C 426 230, 374 354, 256 448 C 138 354, 86 230, 86 108 C 100 74, 184 52, 256 52 Z" 
        fill="none" stroke="#fef08a" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Cross of Firefighters -->
  <g fill="url(#goldGrad)" stroke="#78350f" stroke-width="3">
    <!-- Vertical Cross beam -->
    <path d="M 232 140 L 280 140 L 272 360 L 240 360 Z"/>
    <!-- Horizontal Cross beam -->
    <path d="M 140 232 L 372 232 L 372 280 L 140 280 Z"/>
    <!-- Crossed Axes -->
    <path d="M 160 160 L 352 352" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 352 160 L 160 352" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Central Fire Emblem -->
  <g transform="translate(256, 256) scale(0.85)">
    <!-- Flame -->
    <path d="M 0 -80 C 35 -30, 65 0, 45 45 C 30 75, -30 75, -45 45 C -65 0, -35 -30, 0 -80 Z" fill="#ef4444"/>
    <path d="M 0 -50 C 20 -15, 38 10, 25 35 C 15 50, -15 50, -25 35 C -38 10, -20 -15, 0 -50 Z" fill="#fbbf24"/>
    <path d="M 0 -25 C 10 -5, 18 10, 12 25 C 8 32, -8 32, -12 25 C -18 10, -10 -5, 0 -25 Z" fill="#ffffff"/>
  </g>

  <!-- Star of Life / Emblem Ribbon Banner -->
  <rect x="136" y="380" width="240" height="38" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="2.5"/>
  <text x="256" y="405" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#facc15" text-anchor="middle" letter-spacing="3">CBMMG • CAD</text>
  <text x="256" y="115" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="4">MINAS GERAIS</text>
</svg>
